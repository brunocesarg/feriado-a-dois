name: Preços dos voos

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 6h (Brasília)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Enviar notificação de teste'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: precos

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pywebpush
      - run: python scripts/check_prices.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TEST_PUSH: ${{ inputs.teste && '1' || '' }}
      - name: Salvar preços no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precos.json
          git diff --cached --quiet || (git commit -m "Atualiza preços dos voos" && git push)
